<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Progress</title><link rel="stylesheet" href="style.css"><script src="theme.js"></script>
<style>
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:4px;margin-top:6px}
.heat i{border-radius:3px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--ef-teal) 35%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--ef-teal) 65%,var(--line))}
.heat i.l3{background:var(--ef-teal)}
.heat i.today{outline:2px solid var(--ink);outline-offset:-1px}
.heat i.future{background:none}
.months{display:flex;font-size:12px;color:var(--muted);height:16px;position:relative}
.months span{position:absolute}
.week{font-size:15px;color:var(--muted);margin-top:14px}
.week b{color:var(--ink);font-weight:600}
.row .pct.bad{color:var(--bad)}
</style></head>
<body><div class="phone">
  <div class="ef-band small">
    <svg viewBox="0 0 390 128" preserveAspectRatio="none">
      <polygon points="0,0 250,0 120,128 0,128" fill="var(--ef-teal)"/>
      <polygon points="120,0 300,0 150,128 60,128" fill="var(--ef-navy)" opacity=".85"/>
      <polygon points="0,40 170,128 0,128" fill="var(--ef-sky)" opacity=".55"/>
      <polygon points="200,0 250,0 150,128 125,128" fill="#fff" opacity=".18"/>
    </svg>
    <div class="top">
      <a class="back" href="Main.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>Back</a>
    </div>
    <div class="ef-big">5 days</div>
    <div class="say" style="right:32px;bottom:14px;width:96px;height:96px"><svg viewBox="0 0 100 100"><path d="M61.4,88.5 A44,44 0 1,1 75.2,82.0 L84,96 Z" fill="var(--ef-lime)" fill-opacity=".85"/></svg><span>in a row<br><b style="font-size:13px">best 12</b></span></div>
  </div>

  <div style="flex:1;overflow:auto">
    <div class="pad" style="margin-top:22px">
      <div class="months" id="months"></div>
      <div class="heat" id="heat"></div>
      <div class="week">This week: <b>4 days</b> · <b>312 answers</b> · <b>38 min</b></div>
    </div>

    <div class="pad">
      <div class="kind" style="color:var(--ef-teal);margin:30px 0 2px">Weak spots</div>
      <div class="list">
        <a class="row" href="Section.html">
          <span class="tag g">G</span>
          <div class="grow"><div class="t en">present continuous</div><div class="s">1B</div></div>
          <div class="pct bad">58%</div>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <a class="row" href="Section.html">
          <span class="tag p">P</span>
          <div class="grow"><div class="t en">vowel sounds</div><div class="s">1A</div></div>
          <div class="pct bad">64%</div>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <a class="row" href="Section.html">
          <span class="tag g">G</span>
          <div class="grow"><div class="t en">word order in questions</div><div class="s">1A</div></div>
          <div class="pct">71%</div>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </div>
    </div>

    <div class="pad" style="margin-bottom:28px">
      <div class="kind" style="color:var(--ef-teal);margin:30px 0 10px">Done</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="bar grow"><i style="width:6%"></i></div>
        <div class="label" style="font-size:15px">2 of 36 chapters</div>
      </div>
    </div>
  </div>
</div>
<script>
const heat = document.getElementById('heat'), months = document.getElementById('months');
const weeks = 17, todayCol = weeks - 1, todayRow = 5;
const names = ['Jun', 'Jul', 'Aug', 'Sep'];
let seed = 7;
const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
for (let c = 0; c < weeks; c++) {
  for (let r = 0; r < 7; r++) {
    const i = document.createElement('i');
    const future = c === todayCol && r > todayRow;
    const recent = c * 7 + r > todayCol * 7 + todayRow - 5;
    const started = c >= 9;
    if (future) i.className = 'future';
    else if (recent) i.className = 'l' + (1 + Math.floor(rnd() * 3));
    else if (started && rnd() > 0.35) i.className = 'l' + (1 + Math.floor(rnd() * 3));
    if (c === todayCol && r === todayRow) i.classList.add('today');
    heat.appendChild(i);
  }
}
[1, 5, 9, 14].forEach((c, k) => {
  const s = document.createElement('span'); s.textContent = names[k]; s.style.left = c * 18 + 'px'; months.appendChild(s);
});
</script>
</body></html>
