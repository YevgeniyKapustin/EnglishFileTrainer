<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Listening (later)</title><link rel="stylesheet" href="style.css"><script src="theme.js"></script></head>
<body><div class="phone">
  <div class="top" style="gap:8px">
    <div class="iconbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></div>
    <div class="bar grow"><i style="width:40%"></i></div>
    <span class="later">later</span>
  </div>
  <div class="pad" style="display:flex;flex-direction:column;gap:24px;margin-top:20px">
    <div class="label" style="font-size:15px">Listen and answer</div>
    <div style="display:flex;align-items:center;gap:16px">
      <div style="width:64px;height:64px;border-radius:32px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="var(--paper)"><path d="M8 5v14l11-7z"/></svg></div>
      <div class="grow"><div class="bar"><i style="width:35%"></i></div><div class="label" style="margin-top:8px">0:24 / 1:10</div></div>
    </div>
    <div class="en" style="font-size:22px">[question about the SB 1A recording]</div>
    <textarea class="field" rows="2"></textarea>
  </div>
  <div class="grow"></div>
  <div class="bottom"><button class="btn" disabled>Check</button></div>
</div></body></html>
