<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статистика · варианты расположения</title>
<style>
:root{--paper:#F6F4EE;--ink:#1C1B19;--muted:#6E6A61;--line:#E3DFD5;--accent:#2F4BA0;--page:#E9E6DE;--field:#fff;--ef-teal:#12A3BF;--ef-sky:#7FCBE0;--ef-navy:#1D4E9E;--ef-lime:#A9D46F;--orange:#E8762B}
body.dark{--paper:#1A1917;--ink:#ECE9E2;--muted:#AAA59B;--line:#403D36;--accent:#8FA6E8;--page:#0F0F0E;--field:#24231F}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.4 system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{cursor:default}.shell{max-width:1000px;margin:auto;padding:28px;display:grid;grid-template-columns:minmax(270px,1fr) 390px;gap:36px}.about h1{font-size:29px;line-height:1.15;margin:0 0 8px}.about p{color:var(--muted);margin:0 0 20px}.group{margin:22px 0}.group h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);padding:10px 14px}.seg button.active{background:var(--accent);border-color:var(--accent);color:white}.description{background:var(--field);border:1px solid var(--line);padding:18px;border-radius:18px;max-width:520px}.description strong{display:block;margin-bottom:6px}.description p{margin:0}.note{font-size:13px;color:var(--muted);margin-top:20px}.phone{width:390px;height:844px;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 22px 70px #0002}.screen{height:100%;display:flex;flex-direction:column}.scroll{overflow:auto;flex:1}.band{height:150px;flex:none;position:relative;overflow:hidden;color:white;background:var(--ef-navy)}.band.small{height:150px}.band svg.wedges{width:100%;height:100%;position:absolute;inset:0}.top{height:56px;display:flex;align-items:center;gap:4px;padding:0 12px;position:relative;z-index:1}.top .spacer{flex:1}.top button{border:0;background:transparent;color:inherit;min-height:44px;padding:0 8px}.back{font-weight:500}.gear{font-size:24px}.streak{display:flex;align-items:center;gap:4px;font-weight:700}.flame{color:var(--orange);font-size:22px}.number{position:absolute;bottom:12px;left:24px;font-size:64px;font-weight:750;line-height:1}.bubble{position:absolute;border-radius:100%;width:90px;height:90px;right:43px;bottom:18px;background:#A9D46FD8;color:#10384A;display:grid;place-items:center;text-align:center;font-size:12px;padding:10px;transform:rotate(-7deg)}.bubble.one{right:110px;bottom:8px;background:#7FCBE0D8;transform:rotate(8deg)}.bubble.c-one{right:80px}.bubble.c-two{right:10px}.pad{padding:0 24px}.chapter-title{font-size:25px;line-height:1.25;color:var(--ef-teal);margin:18px 0 12px}.dark .chapter-title{color:var(--ef-sky)}.progress{display:flex;align-items:center;gap:12px;margin-bottom:28px}.bar{height:6px;background:var(--line);flex:1;border-radius:5px;overflow:hidden}.bar i{display:block;background:var(--accent);height:100%;width:38%}.row{border-bottom:1px solid var(--line);padding:15px 0;display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:transparent;color:var(--ink);border-left:0;border-right:0;border-top:0;min-height:64px}.row .grow{flex:1}.row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}.tag{width:24px;height:24px;background:var(--ef-navy);color:#fff;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:700}.tag.green{background:#3E9A3A}.file-label{font-size:13px;font-weight:700;color:var(--ef-teal);text-transform:uppercase;letter-spacing:.07em;padding-top:16px}.badge{background:var(--ef-teal);color:white;border-radius:8px;width:44px;height:36px;display:grid;place-items:center;font-weight:700}.badge.orange{background:var(--orange)}.action{border:0;background:transparent;color:var(--accent);font-weight:650;padding:9px 0}.all-title{display:flex;align-items:center;gap:8px;margin-top:8px;margin-bottom:16px}.all-title h2{font-size:25px;line-height:1.2;margin:0;flex:1}.all-title .action{white-space:nowrap}.bottom{padding:12px 24px 24px;margin-top:auto}.bottom p{color:var(--muted);text-align:center;font-size:13px;margin:0 0 10px}.primary{width:100%;height:56px;background:var(--accent);color:white;border:0;border-radius:16px;font-size:17px;font-weight:700}.stat-entry{width:100%;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:14px;padding:11px 14px;margin:0 0 20px;text-align:left;display:flex;align-items:center;gap:10px}.stat-entry b{flex:1}.stats-head{position:absolute;bottom:14px;left:24px;display:flex;flex-direction:column;align-items:flex-start;gap:1px}.stats-head b{font-size:44px;line-height:1;font-weight:750}.stats-head span{font-size:17px;font-weight:600;line-height:1.2}.stats-content h3{font-size:14px;color:var(--ef-teal);text-transform:uppercase;letter-spacing:.07em;margin:28px 0 10px}.heat-scroll{overflow-x:auto;max-width:100%;padding-bottom:4px}.heat{width:max-content;display:grid;grid-template-columns:repeat(17,14px);grid-template-rows:repeat(7,14px);grid-auto-flow:column;gap:4px;margin:6px 0 12px}.heat i{width:14px;height:14px;border-radius:3px;background:var(--line)}.heat i.hot{background:var(--ef-teal)}.heat i.mid{background:#7FCBE0}.week{color:var(--muted);font-size:14px}.stats-content{padding:24px}.minor{font-size:13px;color:var(--muted)}.inline-streak{margin:0 0 20px;color:var(--accent);font-weight:700}.inline-streak button{border:0;background:none;color:inherit;padding:4px 0}.band-link{position:absolute;bottom:16px;left:110px;border:1px solid #ffffffaa;background:#ffffff22;color:white;border-radius:100px;padding:6px 12px;font-size:13px;font-weight:700;z-index:1}@media(max-width:750px){.shell{display:flex;flex-direction:column;align-items:center;padding:18px;gap:18px}.about{width:min(100%,390px)}.about h1{font-size:23px}.group{margin:13px 0}.description{padding:12px}.phone{width:min(390px,100%);height:min(844px,calc(100dvh - 260px));min-height:500px}}@media(prefers-reduced-motion:no-preference){.screen{animation:appear .15s ease-out}@keyframes appear{from{opacity:.7;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style></head><body><main class="shell"><section class="about"><h1>Где открывать статистику?</h1><p>Кликабельное сравнение на основе текущих экранов English File Trainer.</p><div class="group"><h2>Расположение</h2><div class="seg" id="variants"><button data-variant="A">A · Только все главы</button><button data-variant="B">B · Под прогрессом</button><button data-variant="C">C · В шапке главы</button></div></div><div class="group"><h2>Тема</h2><div class="seg"><button id="light">Светлая</button><button id="dark">Тёмная</button></div></div><div class="description" id="description"></div><p class="note">Переходы внутри телефона: «All chapters», «Statistics» и «Back». Остальные действия служат контекстом макета.</p></section><section class="phone" id="phone" aria-label="Интерактивный макет"></section></main>
<script>
let variant='A', page='chapter', previous='chapter', theme='light';
const descriptions={A:['Статистика только на экране всех глав','В главе остаётся отдельная кнопка настроек. На экране «All chapters» действие «Statistics» стоит справа от заголовка. Это самый спокойный вариант для главного экрана.'],B:['Статистика под прогрессом главы','В главе под полосой прогресса появляется отдельная строка серии с понятной подписью и стрелкой. На экране всех глав входа в статистику нет.'],C:['Статистика в нижней части шапки','Серия показана рядом с номером главы внутри цветного хедера; настройки остаются в верхнем правом углу. На экране всех глав действие «Statistics» доступно повторно.']};
const wedge='<svg class="wedges" viewBox="0 0 390 150" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,0 250,0 120,150 0,150" fill="var(--ef-teal)"/><polygon points="120,0 300,0 150,150 60,150" fill="var(--ef-navy)" opacity=".85"/><polygon points="0,40 170,150 0,150" fill="var(--ef-sky)" opacity=".55"/><polygon points="200,0 250,0 150,150 125,150" fill="#fff" opacity=".18"/></svg>';
const el=id=>document.getElementById(id);
function nav(target){if(target==='stats')previous=page;page=target;render()}
function back(){page=page==='stats'?previous:'chapter';render()}
function chapter(){return `<div class="screen"><div class="scroll"><div class="band">${wedge}<div class="top"><button class="back" data-go="all">All chapters ›</button><span class="spacer"></span><button class="gear" aria-label="Settings" title="Settings">⚙</button></div><b class="number">1A</b>${variant==='C'?'<button class="band-link" data-go="stats">🔥 5 days ›</button>':''}<div class="bubble one ${variant==='C'?'c-one':''}">What do<br>you do?</div><div class="bubble ${variant==='C'?'c-two':''}">I’m at<br>university.</div></div><div class="pad"><h2 class="chapter-title">Are you? Can you? Do you? Did you?</h2><div class="progress"><div class="bar"><i></i></div><span>38%</span></div>${variant==='B'?'<button class="stat-entry" data-go="stats"><span class="flame">♨</span><b>5 days in a row</b><span>›</span></button>':''}<div class="row"><span class="tag">G</span><span class="grow">word order in questions<small>Grammar</small></span><span>52%</span></div><div class="row"><span class="tag green">V</span><span class="grow">common verb phrases<small>Opens after word order in questions</small></span><span>⌁</span></div></div></div><div class="bottom"><p>12 exercises from word order in questions</p><button class="primary">Review</button></div></div>`}
function all(){return `<div class="screen"><div class="top"><button class="back" data-back>‹ Back</button></div><div class="scroll pad"><div class="all-title"><h2>All chapters</h2>${variant==='A'||variant==='C'?'<button class="action" data-go="stats">Statistics ›</button>':''}</div><div class="file-label">File 1</div><button class="row" data-go="chapter"><span class="badge">1A</span><span class="grow">Are you? Can you? Do you? Did you?<small>38% mastered</small></span><span>›</span></button><div class="row"><span class="badge">1B</span><span class="grow">The perfect date?</span><span>›</span></div><div class="row"><span class="badge">1C</span><span class="grow">The Remake Project</span><span>›</span></div><div class="file-label" style="color:var(--orange)">File 2</div><div class="row"><span class="badge orange">2A</span><span class="grow">OMG! Where’s my passport?</span><span>›</span></div><div class="row"><span class="badge orange">2B</span><span class="grow">That’s me in the picture!</span><span>›</span></div></div></div>`}
function stats(){let cells='';for(let i=0;i<119;i++)cells+=`<i class="${i>50&&i%5===0?'hot':i>40&&i%3===0?'mid':''}"></i>`;return `<div class="screen"><div class="scroll"><div class="band small">${wedge}<div class="top"><button class="back" data-back>‹ Back</button></div><div class="stats-head"><b>5 days</b><span>in a row</span></div></div><div class="stats-content"><div class="minor">Jun　　　　　　　　　Jul　　　　　　　　Aug</div><div class="heat-scroll"><div class="heat">${cells}</div></div><div class="week">This week: <b>4 days</b> · <b>312 answers</b> · <b>38 min</b></div><h3>Weak spots</h3><p class="minor">Topics with the most mistakes in the last 2 weeks</p><div class="row"><span class="tag">G</span><span class="grow">present continuous<small>1B · 7 of 12 right</small></span><span>›</span></div><div class="row"><span class="tag">P</span><span class="grow">vowel sounds<small>1A · 9 of 14 right</small></span><span>›</span></div><h3>Done</h3><div class="progress"><div class="bar"><i style="width:6%"></i></div><span>2 of 36 chapters</span></div></div></div></div>`}
function render(){el('phone').innerHTML=page==='chapter'?chapter():page==='all'?all():stats();el('description').innerHTML=`<strong>${descriptions[variant][0]}</strong><p>${descriptions[variant][1]}</p>`;document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',b.dataset.variant===variant));el('light').classList.toggle('active',theme==='light');el('dark').classList.toggle('active',theme==='dark');document.body.classList.toggle('dark',theme==='dark');el('phone').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));el('phone').querySelectorAll('[data-back]').forEach(b=>b.onclick=back)}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;page='chapter';render()});el('light').onclick=()=>{theme='light';render()};el('dark').onclick=()=>{theme='dark';render()};render();
</script></body></html>
