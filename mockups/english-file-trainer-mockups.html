<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English File Trainer · mockups</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap');

:root{--paper:#F6F4EE;--ink:#1C1B19;--muted:#6E6A61;--line:#E3DFD5;--accent:#2F4BA0;
  --ok:#1F6B43;--ok-bg:#E3F0E7;--bad:#A3360F;--bad-bg:#FBE8E0;--warn:#6B4400;--warn-bg:#FAEFD3;
  --field:#FFFFFF;--field-border:#C9C4B8;--disabled:#CFCABF;--off:#A7A297;--chev:#B5B0A5;--on-accent:#FFFFFF;--page:#E9E6DE}
/* Тёмная тема: класс ставит theme.js (Settings → Theme) */
html.dark{--paper:#1A1917;--ink:#ECE9E2;--muted:#9A958B;--line:#2E2C28;--accent:#8FA6E8;
  --ok:#7CC89A;--ok-bg:#1E3327;--bad:#F09A76;--bad-bg:#3A2119;--warn:#E8C47A;--warn-bg:#3A2F17;
  --field:#24231F;--field-border:#45423C;--disabled:#3A3833;--off:#5F5B53;--chev:#5F5B53;--on-accent:#14161F;--page:#0F0F0E}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:'Golos Text',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.en{font-family:'Literata',Georgia,serif}

.phone{width:390px;height:844px;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;position:relative}
.pad{padding:0 24px}
.grow{flex-grow:1}
.top{display:flex;align-items:center;height:56px;padding:0 12px}
.back{display:flex;align-items:center;gap:4px;height:44px;padding:0 8px;font-size:15px;color:var(--muted)}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;cursor:pointer;color:var(--ink)}

.label{font-size:13px;color:var(--muted)}
h1{margin:0;font-size:26px;line-height:1.25;font-weight:700}
h1.en{font-weight:600}

.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}

.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border:0;border-radius:16px;
  background:var(--accent);color:var(--on-accent);font:600 17px 'Golos Text',system-ui,sans-serif;cursor:pointer}
.btn:disabled{background:var(--disabled);cursor:default}
.btn.ghost{background:none;color:var(--accent);height:48px}
.bottom{padding:12px 24px 24px}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{font-size:17px}
.row .s{font-size:13px;color:var(--muted);margin-top:2px}
.row .pct{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.off{color:var(--off);cursor:default}
.chev{color:var(--chev)}

.field{width:100%;min-height:56px;padding:14px 16px;border:1.5px solid var(--field-border);border-radius:14px;background:var(--field);
  font:400 20px 'Literata',Georgia,serif;color:var(--ink);outline:none;resize:none}
.field:focus{border-color:var(--accent)}
.gap{display:inline-block;width:130px;height:40px;margin:0 4px;padding:0 8px;border:0;border-bottom:2px solid var(--accent);
  background:var(--field);border-radius:6px 6px 0 0;font:400 22px 'Literata',Georgia,serif;color:var(--ink);outline:none;text-align:center;vertical-align:baseline}
.field.ok,.gap.ok{border-color:var(--ok);background:var(--ok-bg)}
.field.bad,.gap.bad{border-color:var(--bad);background:var(--bad-bg)}

.sheet{position:absolute;left:0;right:0;bottom:0;padding:20px 24px 24px;border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:6px}
.sheet.ok{background:var(--ok-bg);color:var(--ok)}
.sheet.bad{background:var(--bad-bg);color:var(--bad)}
.sheet .h{font-size:18px;font-weight:700}
.sheet .a{font-size:19px;color:var(--ink);margin:4px 0 12px}
.sheet .btn{margin-top:6px}
.sheet.ok .btn{background:var(--ok)}
.sheet.bad .btn{background:var(--bad)}

.card{background:var(--field);border:1px solid var(--line);border-radius:16px;padding:16px}
.toggle{width:52px;height:32px;border-radius:16px;background:var(--disabled);position:relative;flex-shrink:0;cursor:pointer;transition:background .15s}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:23px}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.later{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:#5E5A52;color:#fff}

.sheet .btn{color:var(--paper)}
.why{align-self:flex-start;border:0;background:none;padding:4px 0;font:600 15px 'Golos Text',sans-serif;color:var(--accent);cursor:pointer}
.why-text{font-size:15px;line-height:1.5;color:var(--ink);max-height:180px;overflow:auto}
.sec{font-size:13px;color:var(--muted);margin:28px 0 4px}
.check{color:var(--accent)}
[hidden]{display:none!important}
html.dark .btn:disabled{color:var(--muted)}


/* Стиль English File: клинья с номером урока, облачки реплик, метки G/V/P */
:root{--ef-teal:#12A3BF;--ef-sky:#7FCBE0;--ef-navy:#1D4E9E;--ef-lime:#A9D46F;--ef-g:#1D4E9E;--ef-v:#3E9A3A;--ef-p:#D02A78}
html.dark{--ef-g:#6F95E0;--ef-v:#79C06F;--ef-p:#F07AAE}
.ef-band{position:relative;height:150px;overflow:hidden;flex-shrink:0}
.ef-band>svg{position:absolute;inset:0;width:100%;height:100%}
.ef-band .top{position:relative;z-index:1}
.ef-band .top .back{color:#fff}
.ef-band .top .iconbtn{color:var(--muted)}
.ef-num{position:absolute;left:24px;bottom:14px;font:700 64px/1 'Golos Text',sans-serif;color:#fff;letter-spacing:-2px}
.bub{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:50%;font:500 12px/1.2 'Golos Text',sans-serif;color:#10384A;padding:10px}
.ef-title{color:var(--ef-teal);font-family:'Golos Text',sans-serif;font-weight:600}
html.dark .ef-title{color:var(--ef-sky)}
.tag{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;font:700 13px 'Golos Text',sans-serif;color:#fff;flex-shrink:0}
.tag.g{background:var(--ef-g)}.tag.v{background:var(--ef-v)}.tag.p{background:var(--ef-p)}
html.dark .tag{color:#14161F}
.row.off .tag{opacity:.4}

/* Плашки и подписи как в учебнике */
:root{--ef-panel:#DDF0F6;--ef-panel2:#E6F2D6;--ef-file2:#E8762B;--ef-file3:#4FA64A}
html.dark{--ef-panel:#16323A;--ef-panel2:#262420}
.kind{font:700 14px 'Golos Text',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.kind.g{color:var(--ef-g)}.kind.v{color:var(--ef-v)}.kind.p{color:var(--ef-p)}
.panel{background:var(--ef-panel);border-radius:14px;padding:6px 16px 10px}
.panel.alt{background:var(--ef-panel2)}
.panel .ph{font:700 12px 'Golos Text',sans-serif;letter-spacing:.06em;color:var(--ef-teal);padding:8px 0 2px}
html.dark .panel .ph{color:var(--ef-sky)}
.note{border:1.5px solid var(--ef-teal);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.5}
.note .nh{color:var(--ef-teal);font-weight:600;margin-bottom:4px;display:flex;gap:6px;align-items:center}
html.dark .note{border-color:var(--ef-sky)}html.dark .note .nh{color:var(--ef-sky)}
.let{color:var(--ef-teal);font-weight:700;width:14px;flex-shrink:0}
html.dark .let{color:var(--ef-sky)}
.ef-band.small{height:128px}
.ef-big{position:absolute;left:24px;bottom:16px;font:700 44px/1 'Golos Text',sans-serif;color:#fff}
.badge{width:44px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 15px 'Golos Text',sans-serif;color:#fff;flex-shrink:0;background:var(--ef-teal)}
.badge.f2{background:var(--ef-file2)}.badge.f3{background:var(--ef-file3)}
.row.off .badge{opacity:.35}

/* Облачко реплики: круг + хвостик одной фигурой, полупрозрачное, как в учебнике */
.say{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font:500 12px/1.2 'Golos Text',sans-serif;color:#10384A;padding:0 12px 12px}
.say svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.say span{position:relative}


.tbl{display:grid;grid-template-columns:auto auto auto 1fr;column-gap:14px}
.tbl div{font-family:'Literata',Georgia,serif;font-size:17px;padding:8px 0;border-top:1px solid rgba(18,163,191,.25)}
.tbl div:nth-child(-n+4){border-top:0}
.tbl .aux{color:var(--accent);font-weight:600}
.mis{font-family:'Literata',Georgia,serif;font-size:17px;line-height:1.6}

.q{font-size:24px;line-height:1.7}
.hint{font-size:17px;color:var(--muted);white-space:nowrap}

.ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico.prov{background:var(--field);border:1px solid var(--line);color:var(--ink)}
.ico.prov svg{width:20px;height:20px}
.provs{display:flex;flex-wrap:wrap;gap:8px 14px}
.provs span{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.provs span svg{width:18px;height:18px;color:var(--ink)}
.provs span.hit{color:var(--ink);font-weight:600}
.opt .check{visibility:hidden;color:var(--ef-teal)}
.opt.on .check{visibility:visible}
.keybox{display:flex;flex-direction:column;gap:12px;padding:4px 0 16px}
.keybox .field{font:400 16px 'Golos Text',system-ui,sans-serif;min-height:52px}
.link{border:0;background:none;padding:6px 0;font:500 15px 'Golos Text',sans-serif;cursor:pointer;align-self:flex-start}

.cur .t{color:var(--ef-teal)}
html.dark .cur .t{color:var(--ef-sky)}
.file{font:700 13px 'Golos Text',sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 2px}

.shell{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:24px}
.nav{width:200px;display:flex;flex-direction:column;gap:4px;position:sticky;top:24px}
.nav .grp{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
.nav .grp:first-child{margin-top:0}
.nav button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font:500 15px 'Golos Text',sans-serif;color:var(--ink);cursor:pointer}
.nav button.on{background:var(--field);color:var(--accent)}
.hello{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.phone{border-radius:24px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
@media (max-width:700px){
  .shell{flex-direction:column;padding:0;gap:0}
  .nav{position:static;width:100%;flex-direction:row;overflow-x:auto;padding:10px 12px;gap:6px;background:var(--page)}
  .nav .grp,.hello{display:none}
  .nav button{flex-shrink:0;background:var(--field)}
  .phone{width:100%;height:calc(100vh - 58px);border-radius:0;box-shadow:none}
}
</style></head>
<body>
<div class="shell">
  <div class="nav"><div class="hello">English File Pre-Intermediate trainer · chapter 1A. Everything is clickable; answers are typed.</div><div class="grp">Main flow</div><button data-go="Main">Chapter</button><button data-go="Section">Section</button><button data-go="Rules">Rules</button><button data-go="Session">Practice (live)</button><button data-go="SessionDone">Session done</button><div class="grp">Other</div><button data-go="Settings">Settings</button><button data-go="Chapters">All chapters</button><button data-go="ChapterDone">Chapter done</button><div class="grp">Later</div><button data-go="Video">Video</button><button data-go="Listening">Listening</button><button data-go="Explain">Explain (v2)</button></div>
  <div id="screen"></div>
</div>
<template id="t-Main"><div class="phone">
  <div class="ef-band">
    <svg viewBox="0 0 390 150" preserveAspectRatio="none">
      <polygon points="0,0 250,0 120,150 0,150" fill="var(--ef-teal)"/>
      <polygon points="120,0 300,0 150,150 60,150" fill="var(--ef-navy)" opacity=".85"/>
      <polygon points="0,40 170,150 0,150" fill="var(--ef-sky)" opacity=".55"/>
      <polygon points="200,0 250,0 150,150 125,150" fill="#fff" opacity=".18"/>
    </svg>
    <div class="top">
      <a class="back" href="Chapters.html">All chapters
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></a>
      <div class="grow"></div>
      <a class="iconbtn" href="Settings.html" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
    </div>
    <div class="ef-num">1A</div>
    <div class="say" style="right:108px;bottom:12px;width:92px;height:92px"><svg viewBox="0 0 100 100"><path d="M24.8,82.0 A44,44 0 1,1 38.6,88.5 L16,96 Z" fill="var(--ef-sky)" fill-opacity=".8"/></svg><span>What do you do?</span></div>
    <div class="say" style="right:40px;bottom:24px;width:88px;height:88px"><svg viewBox="0 0 100 100"><path d="M61.4,88.5 A44,44 0 1,1 75.2,82.0 L84,96 Z" fill="var(--ef-lime)" fill-opacity=".8"/></svg><span>I'm at university.</span></div>
  </div>

  <div class="pad" style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
    <h1 class="ef-title">Are you? Can you? Do you? Did you?</h1>
    <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
      <div class="bar grow"><i style="width:38%"></i></div>
      <div class="label" style="font-size:15px">38%</div>
    </div>
  </div>

  <div class="pad list" style="margin-top:28px">
    <a class="row" href="Section.html">
      <span class="tag g">G</span>
      <div class="grow"><div class="t en">word order in questions</div><div class="s">Grammar</div></div>
      <div class="pct">52%</div>
    </a>
    <div class="row off">
      <span class="tag v">V</span>
      <div class="grow"><div class="t en">common verb phrases</div><div class="s">Opens after word order in questions</div></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
  </div>

  <div class="grow"></div>
  <div class="bottom">
    <div style="text-align:center;font-size:15px;color:var(--muted);margin-bottom:10px">12 exercises from word order in questions</div>
    <a class="btn" href="Session.html">Review</a>
  </div>
</div></template><template id="t-Section"><div class="phone">
  <div class="top"><a class="back" href="Main.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>1A</a></div>

  <div class="pad" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
    <div style="display:flex;align-items:center;gap:8px"><span class="tag g">G</span><span class="kind g">Grammar</span></div>
    <h1 class="en">word order in questions</h1>
  </div>

  <div class="pad list" style="margin-top:24px">
    <a class="row" href="Rules.html">
      <div class="grow"><div class="t">Rules</div></div>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
    </a>
  </div>

  <div>
    <div class="pad label" style="margin-top:28px">Tasks</div>
    <div class="pad list">
      <div class="row"><span class="let">a</span><div class="grow t en">Complete the questions</div><div class="pct">5 / 7</div></div>
      <div class="row"><span class="let">b</span><div class="grow t en">Put the words in order</div><div class="pct">3 / 5</div></div>
      <div class="row"><span class="let">c</span><div class="grow t en">Write the questions</div><div class="pct">1 / 6</div></div>
      <div class="row"><span class="let">d</span><div class="grow t en">Grammar Bank 1A</div><div class="pct">0 / 6</div></div>
    </div>
  </div>

  <div class="grow"></div>
  <div class="bottom"><a class="btn" href="Rules.html">Start section</a></div>
</div></template><template id="t-Rules"><div class="phone">
  <div class="top"><a class="back" href="Section.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>Back</a></div>

  <div class="pad grow" style="display:flex;flex-direction:column;gap:20px;overflow:auto;padding-bottom:12px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px"><span class="tag g">G</span><span class="kind g">Grammar Bank 1A</span></div>
      <h1 class="en">word order in questions</h1>
    </div>

    <div class="panel">
      <div class="ph">WORD ORDER: AUXILIARY BEFORE SUBJECT</div>
      <div class="tbl">
        <div>Where</div><div class="aux">do</div><div>you</div><div>live?</div>
        <div>What</div><div class="aux">did</div><div>you</div><div>do?</div>
        <div></div><div class="aux">Does</div><div>your sister</div><div>have a job?</div>
        <div>Where</div><div class="aux">were</div><div>you</div><div>born?</div>
        <div></div><div class="aux">Can</div><div>I</div><div>help you?</div>
      </div>
    </div>

    <div class="note"><div class="nh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>be and can</div>With <span class="en">be</span> and <span class="en">can</span>, don’t use <span class="en">do</span>. Prepositions go at the end: <span class="en">Who do you live <b>with</b>?</span></div>

    <div class="panel alt mis" style="padding:10px 16px">
      <div><s style="color:var(--bad)">Where you were born?</s> → <span style="color:var(--ok)">Where were you born?</span></div>
      <div><s style="color:var(--bad)">Did you saw the match?</s> → <span style="color:var(--ok)">Did you see…?</span></div>
    </div>
  </div>

  <div class="bottom"><a class="btn" href="Session.html">Go to tasks</a></div>
</div></template><template id="t-Session"><div class="phone">
  <div class="top" style="gap:8px">
    <a class="iconbtn" href="Main.html" aria-label="Close">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <div class="bar grow"><i id="prog" style="width:0"></i></div>
    <div class="label" id="count" style="width:48px;text-align:right;font-size:14px"></div>
  </div>

  <div class="pad" style="display:flex;flex-direction:column;gap:20px;margin-top:20px">
    <div style="display:flex;align-items:center;gap:8px">
      <span class="tag g">G</span>
      <div class="grow" id="instr" style="font-size:15px;font-weight:600;color:var(--ef-g)"></div>
    </div>
    <div id="body"></div>
  </div>

  <div class="grow"></div>
  <div class="bottom" id="checkWrap"><button class="btn" id="check" onclick="check()" disabled>Check</button></div>
  <div id="sheet"></div>
</div></template><template id="t-SessionDone"><div class="phone">
  <div class="ef-band small">

const NAMES = {deepseek: 'DeepSeek', openai: 'OpenAI', gemini: 'Gemini', claude: 'Claude', openrouter: 'OpenRouter'};
const KEY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M16 7l3 3M14 9l2 2"/></svg>';
// Провайдер по виду ключа. «sk-» + 32 hex — DeepSeek; остальные «sk-» считаем OpenAI.
function detect(k) {
  k = (k || '').trim();
  if (!k) return null;
  if (k.startsWith('sk-ant-')) return 'claude';
  if (k.startsWith('sk-or-')) return 'openrouter';
  if (k.startsWith('AIza')) return 'gemini';
  if (/^sk-[0-9a-f]{32}$/.test(k)) return 'deepseek';
  if (k.startsWith('sk-')) return 'openai';
  return 'unknown';
}
function paintProvs(hit) {
  document.getElementById('provs').innerHTML = Object.keys(NAMES)
    .map(p => `<span class="${p === hit ? 'hit' : ''}">${ICONS[p]}${NAMES[p]}</span>`).join('');
  const d = document.getElementById('detect');
  d.textContent = hit === 'unknown' ? "This doesn't look like a key from these:" : hit ? NAMES[hit] + ' key' : 'Works with any of these:';
  d.style.color = hit === 'unknown' ? 'var(--bad)' : '';
}
function paintKey() {
  const k = store.get('ef-ai-key'), p = detect(k);
  document.getElementById('keyIco').innerHTML = p && ICONS[p] ? ICONS[p] : KEY_ICON;
  document.getElementById('keyState').textContent = k ? 'On · ' + (NAMES[p] || 'API') + ' · …' + k.slice(-4) : 'Not set';
  document.getElementById('keyRemove').hidden = !k;
  paintProvs(null);
}
const box = document.getElementById('keyBox'), input = document.getElementById('keyInput'), save = document.getElementById('keySave');
document.getElementById('keyRow').onclick = () => { box.hidden = !box.hidden; input.value = ''; save.disabled = true; if (!box.hidden && window === top) input.focus(); };
input.oninput = () => { const p = detect(input.value); save.disabled = !p || p === 'unknown'; paintProvs(p); };
save.onclick = () => { store.set('ef-ai-key', input.value.trim()); box.hidden = true; paintKey(); };
document.getElementById('keyRemove').onclick = () => { store.set('ef-ai-key', null); box.hidden = true; paintKey(); };
paintTheme(); paintKey();
; window.check = typeof check !== "undefined" ? check : undefined;}};
function go(name) {
  const box = document.getElementById('screen');
  box.innerHTML = '';
  box.appendChild(document.getElementById('t-' + name).content.cloneNode(true));
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.go === name));
  if (SCRIPTS[name]) SCRIPTS[name]();
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) { go(b.dataset.go); return; }
  const a = e.target.closest('a[href$=".html"]');
  if (a) { e.preventDefault(); go(a.getAttribute('href').replace('.html', '')); }
});
go('Main');
